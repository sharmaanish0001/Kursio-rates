name: Update larger companies from MCA (runs on the computer in India)

# MCA's data only answers Indian connections, so this runs on the self-hosted runner.
# It starts by hand or once a week. If the computer is off, it waits until it is back.
on:
  schedule:
    - cron: '0 1 * * 0'      # Sunday, early morning in India
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-mca
  cancel-in-progress: false

jobs:
  mca:
    runs-on: self-hosted
    timeout-minutes: 600
    env:
      DATAGOV_KEY: ${{ secrets.DATAGOV_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      MCA_CACHE: C:\runner\mca-cache
    steps:
      - uses: actions/checkout@v4
      - name: Download and size the companies
        shell: cmd
        run: node scripts/mca.mjs
