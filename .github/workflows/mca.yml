name: Update MCA company sizes

# Needs the computer in India to be on, because data.gov.in only answers Indian connections.
# Runs on the first of each month, or by hand. If the computer is off, the run just fails and nothing changes.
on:
  schedule:
    - cron: '0 20 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-mca
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 240
    env:
      DATAGOV_KEY: ${{ secrets.DATAGOV_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the company data from MCA
        shell: cmd
        run: node scripts/mca.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mca-companies
          path: mca-companies.json
          if-no-files-found: error

  publish:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mca-companies
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the company list
        run: node scripts/companies.mjs
      - name: Save the files if they changed
        run: |
          if [ -z "$(git status --porcelain -- companies.json mca-companies.json)" ]; then
            echo "No change"
          else
            git config user.name "kursio-rates bot"
            git config user.email "actions@users.noreply.github.com"
            git add companies.json mca-companies.json
            git commit -m "Company list update with MCA sizes"
            git pull --rebase -q origin main || true
            git push
          fi
