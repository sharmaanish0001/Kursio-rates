name: MCA probe (runs on the computer in India)

# Manual only. Runs on the self-hosted runner so data.gov.in sees an Indian connection.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      DATAGOV_KEY: ${{ secrets.DATAGOV_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Count the slices
        shell: cmd
        run: node scripts/mca-probe.mjs
