name: MCA probe (runs on the computer in India)

# Manual only. Runs on the self-hosted runner so data.gov.in sees an Indian connection.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      DATAGOV_KEY: ${{ secrets.DATAGOV_KEY }}
    steps:
      - name: Look for the company datasets
        shell: cmd
        run: |
          set RES=4dbe5667-7b6b-41d7-82af-211562424d9a
          echo == sample 3 records
          curl.exe -sS -g -m 90 -A "Mozilla/5.0" -G "https://api.data.gov.in/resource/%RES%" --data-urlencode "api-key=%DATAGOV_KEY%" --data-urlencode "format=json" --data-urlencode "offset=0" --data-urlencode "limit=3"
          echo.
          echo == active companies count
          curl.exe -sS -g -m 90 -A "Mozilla/5.0" -G "https://api.data.gov.in/resource/%RES%" --data-urlencode "api-key=%DATAGOV_KEY%" --data-urlencode "format=json" --data-urlencode "offset=0" --data-urlencode "limit=1" --data-urlencode "filters[CompanyStatus]=Active"
          echo.
          echo == name filter test
          curl.exe -sS -g -m 90 -A "Mozilla/5.0" -G "https://api.data.gov.in/resource/%RES%" --data-urlencode "api-key=%DATAGOV_KEY%" --data-urlencode "format=json" --data-urlencode "offset=0" --data-urlencode "limit=3" --data-urlencode "filters[CompanyName]=XCEEDANCE CONSULTING PRIVATE LIMITED"
          echo.
          echo == big page timing 1000 records
          curl.exe -sS -g -m 120 -A "Mozilla/5.0" -G "https://api.data.gov.in/resource/%RES%" --data-urlencode "api-key=%DATAGOV_KEY%" --data-urlencode "format=json" --data-urlencode "offset=0" --data-urlencode "limit=1000" -o NUL -w "http %{http_code} bytes %{size_download} seconds %{time_total}\n"
