name: MCA probe (runs on the computer in India)

# Manual only. Runs on the self-hosted runner so data.gov.in sees an Indian connection.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      DATAGOV_KEY: ${{ secrets.DATAGOV_KEY }}
    steps:
      - name: Look for the company datasets
        shell: cmd
        run: |
          echo == search 1: company master data
          curl.exe -sS -g -m 60 -A "Mozilla/5.0" -G "https://api.data.gov.in/lists" --data-urlencode "format=json" --data-urlencode "notfilters[source]=visualize.data.gov.in" --data-urlencode "filters[title]=company master data" --data-urlencode "offset=0" --data-urlencode "limit=30" --data-urlencode "api-key=%DATAGOV_KEY%"
          echo.
          echo == search 2: registered companies
          curl.exe -sS -g -m 60 -A "Mozilla/5.0" -G "https://api.data.gov.in/lists" --data-urlencode "format=json" --data-urlencode "notfilters[source]=visualize.data.gov.in" --data-urlencode "filters[title]=registered companies" --data-urlencode "offset=0" --data-urlencode "limit=30" --data-urlencode "api-key=%DATAGOV_KEY%"
          echo.
